<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <title>MES — Live Monitor</title>

    <!-- ─── APP KHULNE WALA SPLASH ───────────────────────────────────────
         App band karke kholne par pehle SAFED screen aati thi (Capacitor ka
         apna default splash safed tha, usi ka neela logo bhi).  Ab uski jagah
         ye aata hai.

         Yahan HTML me isliye rakha hai, PNG me nahi -- PNG hil nahi sakti.
         Yahan asli animation milti hai aur rang app ke saath mel khaata hai.

         Rang: upar aasmani, neeche jaakar `#060d1a` -- wahi jo login page ka
         background hai.  Isse splash se page par jaate waqt jhatka nahi lagta.

         ⚠ WEBSITE PAR KABHI NAHI DIKHTA.  Default me `hidden` hai; neeche
         wali chhoti script sirf app me hataati hai (app ka pata hamesha
         `https://localhost` bina port ke hota hai -- `androidScheme: https`).
         Website par ye ek pal ko bhi nahi jhalakta. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 70% 45% at 50% 22%, rgba(125,211,252,.45), transparent 70%),
          linear-gradient(180deg, #38bdf8 0%, #0284c7 26%, #075985 52%, #0b1a33 78%, #060d1a 100%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        opacity: 1; transition: opacity .45s ease;
      }
      #boot-splash[hidden] { display: none; }
      #boot-splash.ja-raha { opacity: 0; }

      /* halke se taerte huye rang ke gole -- background zinda lage */
      #boot-splash::before,
      #boot-splash::after {
        content: ''; position: absolute; border-radius: 50%;
        filter: blur(46px); pointer-events: none;
      }
      #boot-splash::before {
        width: 62vw; height: 62vw; left: -18vw; top: 4vh;
        background: rgba(56,189,248,.38); animation: bs-taro 7s ease-in-out infinite;
      }
      #boot-splash::after {
        width: 52vw; height: 52vw; right: -14vw; top: 34vh;
        background: rgba(14,165,233,.30); animation: bs-taro 9s ease-in-out infinite reverse;
      }
      @keyframes bs-taro {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50%      { transform: translate3d(0, -5vh, 0) scale(1.12); }
      }

      .bs-logo {
        position: relative;
        width: 108px; height: 108px; border-radius: 26px;
        background: #fff; display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        box-shadow: 0 18px 44px rgba(2, 32, 71, .45), 0 0 0 1px rgba(255,255,255,.35);
        animation: bs-aao .75s cubic-bezier(.16,1,.3,1) both;
      }
      .bs-logo img { width: 78%; height: 78%; object-fit: contain; }
      @keyframes bs-aao {
        from { opacity: 0; transform: scale(.82) translateY(14px); }
        to   { opacity: 1; transform: scale(1)   translateY(0); }
      }

      /* logo ke chaaro taraf ek phailta hua halka ghera */
      .bs-logo::after {
        content: ''; position: absolute; inset: -10px; border-radius: 34px;
        border: 2px solid rgba(255,255,255,.55);
        animation: bs-ghera 2.2s ease-out infinite;
      }
      @keyframes bs-ghera {
        0%   { transform: scale(.94); opacity: .75; }
        70%  { transform: scale(1.22); opacity: 0; }
        100% { transform: scale(1.22); opacity: 0; }
      }

      .bs-naam {
        position: relative;
        margin-top: 22px; color: #fff; font-size: 25px; font-weight: 800;
        letter-spacing: .012em; text-shadow: 0 2px 14px rgba(2,32,71,.5);
        animation: bs-aao .75s cubic-bezier(.16,1,.3,1) .12s both;
      }
      .bs-naam b { font-weight: 800; color: #e0f2fe; }
      .bs-upnaam {
        position: relative;
        margin-top: 5px; color: rgba(224,242,254,.82); font-size: 12px;
        font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
        animation: bs-aao .75s cubic-bezier(.16,1,.3,1) .2s both;
      }

      /* neeche chalti hui patti -- "kuch ho raha hai" ka ishara */
      .bs-patti {
        position: relative; margin-top: 30px;
        width: 132px; height: 3px; border-radius: 99px;
        background: rgba(255,255,255,.22); overflow: hidden;
        animation: bs-aao .75s cubic-bezier(.16,1,.3,1) .28s both;
      }
      .bs-patti span {
        position: absolute; inset: 0 auto 0 0; width: 42%;
        border-radius: 99px; background: #fff;
        animation: bs-daudo 1.15s ease-in-out infinite;
      }
      @keyframes bs-daudo {
        0%   { left: -45%; }
        100% { left: 100%; }
      }

      /* Jinhone phone me animation band ki hui hai, unke liye sthir splash */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash::before, #boot-splash::after,
        .bs-logo, .bs-logo::after, .bs-naam, .bs-upnaam,
        .bs-patti, .bs-patti span { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" hidden>
      <div class="bs-logo"><img src="/logo.jpg" alt="" /></div>
      <div class="bs-naam">Main<b>ten</b>ance</div>
      <div class="bs-upnaam">Management System</div>
      <div class="bs-patti"><span></span></div>
    </div>
    <script>
      /* Splash SIRF app me.  App ka pata hamesha `https://localhost` hota hai
         aur usme port nahi hota (`androidScheme: https`).  Website kisi asli
         host par chalti hai, ya dev me `http://localhost:9965` -- dono is
         shart se bahar hain, isliye wahan splash dikhta hi nahi. */
      (function () {
        try {
          var app = location.protocol === "https:"
                 && location.hostname === "localhost"
                 && !location.port;
          if (app) document.getElementById("boot-splash").hidden = false;

          /* ─── TV: 75% ZOOM ────────────────────────────────────────────
             TV par site BROWSER me 75% zoom par khulti hai, aur usi se view
             sahi baithta hai.  App me zoom hota hi nahi, isliye wahi view
             nahi milta.  Yahan wahi 75% laga dete hain -- `initial-scale`
             browser ke zoom jaisa hi kaam karta hai, aur iske liye TV ke
             asli pixel jaanne ki zarurat nahi.

             Yahan (React se PEHLE) isliye lagana padta hai -- viewport baad
             me badalne par layout theek se dobara nahi banta.

             PEHCHAAN -- shak ki haalat me PHONE:
               badi screen (>=900px)  -> pakka TV
               ya TOUCH bilkul nahi   -> TV (remote se chalti hai)
             Phone par touch hamesha hota hai, isliye wo kabhi is me nahi
             aayega.  Aur agar dono me se kuch pata na chale to phone hi
             maana jaata hai -- kyunki phone ko TV samajh lena app ko bekaar
             kar deta hai, jabki TV ko phone samajhna sirf bhadda lagta hai. */
          if (app) {
            var chaudai   = window.innerWidth || 0;
            var touchNahi = navigator.maxTouchPoints === 0;
            if (chaudai >= 900 || touchNahi) {
              var m = document.querySelector('meta[name="viewport"]');
              if (m) m.setAttribute("content", "width=device-width, initial-scale=0.75");
              document.documentElement.setAttribute("data-tv", "1");
            }
          }
        } catch (e) { /* kuch bhi ho to splash mat dikhao */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
